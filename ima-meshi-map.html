<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>今メシ｜栄・伏見の営業中グルメマップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root{
    --paper:#FAF5EC;
    --ink:#2B2118;
    --miso:#8C3A2B;
    --miso-deep:#6E2C20;
    --dashi:#D8A24A;
    --open:#4B7A5B;
    --closed:#A79E90;
    --line:#E4D9C6;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
  }

  /* Header */
  header{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:var(--paper);
    z-index:500;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand h1{
    font-family:'Shippori Mincho B1', serif;
    font-weight:700;
    font-size:28px;
    margin:0;
    color:var(--miso-deep);
    letter-spacing:0.02em;
  }
  .brand span{
    font-size:12px;
    color:var(--ink);
    opacity:0.55;
  }
  .subline{
    margin:4px 0 0;
    font-size:13px;
    color:var(--ink);
    opacity:0.6;
  }
  .clock{
    font-variant-numeric:tabular-nums;
    font-weight:500;
  }

  /* Controls */
  .controls{
    padding:14px 20px 4px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .open-toggle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 14px;
  }
  .open-toggle .label{
    font-size:14px;
    font-weight:500;
  }
  .open-toggle .count{
    font-size:12px;
    color:var(--ink);
    opacity:0.5;
    margin-left:6px;
  }
  .switch{
    position:relative;
    width:44px;
    height:26px;
    flex-shrink:0;
  }
  .switch input{
    opacity:0;
    width:0;
    height:0;
  }
  .slider{
    position:absolute;
    inset:0;
    background:#D8CFBE;
    border-radius:999px;
    cursor:pointer;
    transition:background .18s ease;
  }
  .slider::before{
    content:"";
    position:absolute;
    height:20px;
    width:20px;
    left:3px;
    top:3px;
    background:white;
    border-radius:50%;
    transition:transform .18s ease;
    box-shadow:0 1px 2px rgba(0,0,0,.2);
  }
  .switch input:checked + .slider{ background:var(--open); }
  .switch input:checked + .slider::before{ transform:translateX(18px); }

  .genre-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    scrollbar-width:none;
  }
  .genre-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--card);
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .chip.active{
    background:var(--miso);
    border-color:var(--miso);
    color:white;
  }

  /* Map */
  #map{
    height:280px;
    width:100%;
    margin-top:12px;
    filter:saturate(0.9);
  }
  .leaflet-popup-content-wrapper{
    border-radius:10px;
    font-family:'Noto Sans JP', sans-serif;
  }
  .pin-badge{
    display:flex;
    align-items:center;
    justify-content:center;
    width:30px;
    height:30px;
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    box-shadow:0 2px 4px rgba(0,0,0,.25);
    border:2px solid white;
  }
  .pin-badge span{
    transform:rotate(45deg);
    font-size:14px;
  }
  .pin-open{ background:var(--open); }
  .pin-closed{ background:var(--closed); }

  /* List */
  .list-head{
    padding:18px 20px 8px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .list-head h2{
    font-family:'Shippori Mincho B1', serif;
    font-size:16px;
    margin:0;
    font-weight:700;
  }
  .list-head .n{
    font-size:12px;
    opacity:0.5;
  }
  ul.shop-list{
    list-style:none;
    margin:0;
    padding:0 20px 28px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .shop-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    display:flex;
    gap:12px;
    align-items:flex-start;
    cursor:pointer;
    transition:border-color .15s ease;
  }
  .shop-card:hover{ border-color:var(--dashi); }
  .thumb{
    width:46px;
    height:46px;
    border-radius:10px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    color:white;
  }
  .shop-main{ flex:1; min-width:0; }
  .shop-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .shop-name{
    font-weight:700;
    font-size:14.5px;
    margin:0;
    line-height:1.4;
  }
  .status-pill{
    flex-shrink:0;
    font-size:11px;
    font-weight:700;
    padding:3px 8px;
    border-radius:999px;
    white-space:nowrap;
  }
  .status-open{ background:#E7F1E9; color:var(--open); }
  .status-closed{ background:#EFECE5; color:var(--closed); }
  .shop-meta{
    margin:5px 0 0;
    font-size:12.5px;
    opacity:0.65;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .shop-meta .dot::before{ content:"・"; opacity:0.6; }

  footer{
    padding:16px 20px 28px;
    font-size:11px;
    text-align:center;
    color:var(--ink);
    opacity:0.45;
    border-top:1px solid var(--line);
  }
  footer a{ color:inherit; }

  .banner{
    margin:14px 20px 0;
    padding:11px 13px;
    background:#FFF6E9;
    border:1px solid #EFDBAE;
    border-radius:10px;
    font-size:12px;
    line-height:1.6;
    color:#6E5327;
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <h1>今メシ</h1>
      <span>栄・伏見 営業中グルメマップ</span>
    </div>
    <p class="subline">現在時刻 <span class="clock" id="clock">--:--</span> 時点で営業中のお店を表示</p>
  </header>

  <div class="banner">
    プロトタイプ版：店舗データはサンプルです。実店舗データはホットペッパーグルメAPI連携後に反映されます。
  </div>

  <div class="controls">
    <div class="open-toggle">
      <div>
        <span class="label">営業中のみ表示</span>
        <span class="count" id="openCount"></span>
      </div>
      <label class="switch">
        <input type="checkbox" id="openOnly" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="genre-row" id="genreRow"></div>
  </div>

  <div id="map"></div>

  <div class="list-head">
    <h2>店舗一覧</h2>
    <span class="n" id="listCount"></span>
  </div>
  <ul class="shop-list" id="shopList"></ul>

  <footer>
    地図データ &copy; OpenStreetMap contributors ／ プロトタイプ用サンプルデータ表示中
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---- サンプルデータ（実運用ではホットペッパーAPIのレスポンスに置き換え） ----
const GENRE_COLORS = {
  "居酒屋": "#8C3A2B",
  "焼肉": "#B0432B",
  "ラーメン": "#C97A2B",
  "カフェ": "#8A6A3F",
  "寿司": "#3F6B8A",
  "イタリアン": "#5C7A4B",
  "中華": "#A6402F"
};
const GENRE_ICON = {
  "居酒屋": "🍶",
  "焼肉": "🥩",
  "ラーメン": "🍜",
  "カフェ": "☕",
  "寿司": "🍣",
  "イタリアン": "🍝",
  "中華": "🥟"
};

const shops = [
  {name:"炭火焼鳥 伏見横丁", genre:"居酒屋", area:"伏見", budget:"¥3,000〜¥4,000", open:"17:00", close:"24:00", lat:35.1660, lng:136.8990},
  {name:"栄 ホルモン本舗", genre:"焼肉", area:"栄", budget:"¥4,000〜¥5,000", open:"17:30", close:"01:00", lat:35.1705, lng:136.9085},
  {name:"らーめん 一心", genre:"ラーメン", area:"栄", budget:"¥900〜¥1,300", open:"11:00", close:"22:00", lat:35.1692, lng:136.9065},
  {name:"喫茶 モーニング堂", genre:"カフェ", area:"伏見", budget:"¥600〜¥1,000", open:"07:00", close:"18:00", lat:35.1648, lng:136.8975},
  {name:"名駅寿司 伏見店", genre:"寿司", area:"伏見", budget:"¥5,000〜¥8,000", open:"17:00", close:"23:00", lat:35.1672, lng:136.8998},
  {name:"Trattoria Sakae", genre:"イタリアン", area:"栄", budget:"¥4,000〜¥6,000", open:"11:30", close:"23:00", lat:35.1715, lng:136.9078},
  {name:"中華食堂 龍門", genre:"中華", area:"栄", budget:"¥1,000〜¥2,500", open:"11:00", close:"21:30", lat:35.1699, lng:136.9052},
  {name:"もつ鍋 伏見本店", genre:"居酒屋", area:"伏見", budget:"¥3,500〜¥4,500", open:"18:00", close:"25:00", lat:35.1655, lng:136.9005},
  {name:"焼肉 極 栄店", genre:"焼肉", area:"栄", budget:"¥5,000〜¥7,000", open:"17:00", close:"23:30", lat:35.1720, lng:136.9098},
  {name:"深夜ラーメン こく味", genre:"ラーメン", area:"栄", budget:"¥800〜¥1,200", open:"21:00", close:"04:00", lat:35.1685, lng:136.9040},
];

// ---- 営業中判定（日またぎ対応） ----
function toMinutes(hhmm){
  const [h,m] = hhmm.split(":").map(Number);
  return h*60+m;
}
function isOpenNow(shop, now){
  const nowMin = now.getHours()*60 + now.getMinutes();
  let o = toMinutes(shop.open);
  let c = toMinutes(shop.close);
  if(c <= o){ c += 24*60; } // 日またぎ
  let n = nowMin;
  if(n < o && (c - 24*60) > 0 && shop.close < shop.open){ n += 24*60; }
  return n >= o && n < c;
}

// ---- 状態 ----
let activeGenre = "すべて";
let openOnly = true;

// ---- 地図初期化 ----
const map = L.map('map', {zoomControl:false, attributionControl:false}).setView([35.1685, 136.9040], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
}).addTo(map);
L.control.zoom({position:'bottomright'}).addTo(map);

let markers = [];

function makeIcon(shop, open){
  const color = open ? '#4B7A5B' : '#A79E90';
  const html = `<div class="pin-badge ${open?'pin-open':'pin-closed'}" style="background:${color}"><span>${GENRE_ICON[shop.genre]||'🍽'}</span></div>`;
  return L.divIcon({html, className:'', iconSize:[30,30], iconAnchor:[15,30], popupAnchor:[0,-28]});
}

function render(){
  const now = new Date();
  document.getElementById('clock').textContent =
    String(now.getHours()).padStart(2,'0')+":"+String(now.getMinutes()).padStart(2,'0');

  const withStatus = shops.map(s => ({...s, open_now: isOpenNow(s, now)}));
  const openCount = withStatus.filter(s=>s.open_now).length;
  document.getElementById('openCount').textContent = `${openCount}/${shops.length}件が営業中`;

  let filtered = withStatus.filter(s => activeGenre === "すべて" || s.genre === activeGenre);
  if(openOnly) filtered = filtered.filter(s => s.open_now);

  // markers
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  filtered.forEach(s => {
    const marker = L.marker([s.lat, s.lng], {icon: makeIcon(s, s.open_now)}).addTo(map);
    marker.bindPopup(`<strong>${s.name}</strong><br>${s.genre}・${s.budget}<br>営業時間 ${s.open}〜${s.close}`);
    markers.push(marker);
  });

  // list
  const list = document.getElementById('shopList');
  list.innerHTML = '';
  document.getElementById('listCount').textContent = `${filtered.length}件`;

  if(filtered.length === 0){
    list.innerHTML = `<li style="text-align:center; padding:24px 0; opacity:0.5; font-size:13px;">条件に合うお店が見つかりませんでした</li>`;
    return;
  }

  filtered
    .sort((a,b) => (b.open_now - a.open_now))
    .forEach(s => {
      const li = document.createElement('li');
      li.className = 'shop-card';
      const color = GENRE_COLORS[s.genre] || '#8C3A2B';
      li.innerHTML = `
        <div class="thumb" style="background:${color}">${GENRE_ICON[s.genre]||'🍽'}</div>
        <div class="shop-main">
          <div class="shop-top">
            <p class="shop-name">${s.name}</p>
            <span class="status-pill ${s.open_now?'status-open':'status-closed'}">${s.open_now?'営業中':'営業時間外'}</span>
          </div>
          <div class="shop-meta">
            <span>${s.genre}</span>
            <span class="dot">${s.area}</span>
            <span class="dot">${s.budget}</span>
            <span class="dot">${s.open}〜${s.close}</span>
          </div>
        </div>
      `;
      li.addEventListener('click', () => {
        map.setView([s.lat, s.lng], 17, {animate:true});
      });
      list.appendChild(li);
    });
}

// ---- ジャンルチップ ----
const genres = ["すべて", ...Object.keys(GENRE_COLORS)];
const genreRow = document.getElementById('genreRow');
genres.forEach(g => {
  const chip = document.createElement('div');
  chip.className = 'chip' + (g === activeGenre ? ' active' : '');
  chip.textContent = g;
  chip.addEventListener('click', () => {
    activeGenre = g;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    render();
  });
  genreRow.appendChild(chip);
});

document.getElementById('openOnly').addEventListener('change', (e) => {
  openOnly = e.target.checked;
  render();
});

render();
setInterval(render, 30000); // 30秒ごとに営業中判定を更新
</script>
</body>
</html>
