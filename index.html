<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>今メシ｜栄・伏見の営業中グルメマップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root{
    --paper:#FAF5EC;
    --ink:#2B2118;
    --miso:#8C3A2B;
    --miso-deep:#6E2C20;
    --dashi:#D8A24A;
    --open:#4B7A5B;
    --closed:#A79E90;
    --unknown:#B99B6B;
    --line:#E4D9C6;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
  }

  header{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:var(--paper);
    z-index:500;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand h1{
    font-family:'Shippori Mincho B1', serif;
    font-weight:700;
    font-size:28px;
    margin:0;
    color:var(--miso-deep);
    letter-spacing:0.02em;
  }
  .brand span{ font-size:12px; color:var(--ink); opacity:0.55; }
  .subline{ margin:4px 0 0; font-size:13px; color:var(--ink); opacity:0.6; }
  .clock{ font-variant-numeric:tabular-nums; font-weight:500; }

  .controls{ padding:14px 20px 4px; display:flex; flex-direction:column; gap:10px; }
  .open-toggle{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card); border:1px solid var(--line); border-radius:10px; padding:11px 14px;
  }
  .open-toggle .label{ font-size:14px; font-weight:500; }
  .open-toggle .count{ font-size:12px; color:var(--ink); opacity:0.5; margin-left:6px; }
  .switch{ position:relative; width:44px; height:26px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{
    position:absolute; inset:0; background:#D8CFBE; border-radius:999px; cursor:pointer;
    transition:background .18s ease;
  }
  .slider::before{
    content:""; position:absolute; height:20px; width:20px; left:3px; top:3px;
    background:white; border-radius:50%; transition:transform .18s ease;
    box-shadow:0 1px 2px rgba(0,0,0,.2);
  }
  .switch input:checked + .slider{ background:var(--open); }
  .switch input:checked + .slider::before{ transform:translateX(18px); }

  .genre-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
  .genre-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto; padding:7px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); font-size:13px; cursor:pointer; white-space:nowrap;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .chip.active{ background:var(--miso); border-color:var(--miso); color:white; }

  #map{ height:280px; width:100%; margin-top:12px; filter:saturate(0.9); }
  .leaflet-popup-content-wrapper{ border-radius:10px; font-family:'Noto Sans JP', sans-serif; }
  .pin-badge{
    display:flex; align-items:center; justify-content:center; width:30px; height:30px;
    border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    box-shadow:0 2px 4px rgba(0,0,0,.25); border:2px solid white;
  }
  .pin-badge span{ transform:rotate(45deg); font-size:14px; }

  .list-head{ padding:18px 20px 8px; display:flex; align-items:baseline; justify-content:space-between; }
  .list-head h2{ font-family:'Shippori Mincho B1', serif; font-size:16px; margin:0; font-weight:700; }
  .list-head .n{ font-size:12px; opacity:0.5; }
  ul.shop-list{ list-style:none; margin:0; padding:0 20px 28px; display:flex; flex-direction:column; gap:10px; }
  .shop-card{
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px;
    display:flex; gap:12px; align-items:flex-start; cursor:pointer; transition:border-color .15s ease;
  }
  .shop-card:hover{ border-color:var(--dashi); }
  .thumb{
    width:46px; height:46px; border-radius:10px; flex-shrink:0; display:flex;
    align-items:center; justify-content:center; font-size:20px; color:white; overflow:hidden;
    background-size:cover; background-position:center;
  }
  .shop-main{ flex:1; min-width:0; }
  .shop-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .shop-name{ font-weight:700; font-size:14.5px; margin:0; line-height:1.4; }
  .status-pill{
    flex-shrink:0; font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; white-space:nowrap;
  }
  .status-open{ background:#E7F1E9; color:var(--open); }
  .status-closed{ background:#EFECE5; color:var(--closed); }
  .status-unknown{ background:#F5EDDD; color:var(--unknown); }
  .shop-meta{ margin:5px 0 0; font-size:12.5px; opacity:0.65; display:flex; gap:8px; flex-wrap:wrap; }
  .shop-meta .dot::before{ content:"・"; opacity:0.6; }
  .shop-link{ font-size:12px; color:var(--miso); text-decoration:none; margin-top:6px; display:inline-block; }

  footer{
    padding:16px 20px 28px; font-size:11px; text-align:center; color:var(--ink); opacity:0.6;
    border-top:1px solid var(--line); line-height:1.7;
  }
  footer a{ color:inherit; }

  .banner{
    margin:14px 20px 0; padding:11px 13px; background:#FFF6E9; border:1px solid #EFDBAE;
    border-radius:10px; font-size:12px; line-height:1.6; color:#6E5327;
  }
  .banner.error{ background:#FBECEA; border-color:#E9C3BC; color:#7A3226; }
  .loading{ text-align:center; padding:24px 0; opacity:0.5; font-size:13px; }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <h1>今メシ</h1>
      <span>栄・伏見 営業中グルメマップ</span>
    </div>
    <p class="subline">現在時刻 <span class="clock" id="clock">--:--</span> 時点で営業中のお店を表示</p>
  </header>

  <div id="statusBanner"></div>

  <div class="controls">
    <div class="open-toggle">
      <div>
        <span class="label">営業中のみ表示</span>
        <span class="count" id="openCount"></span>
      </div>
      <label class="switch">
        <input type="checkbox" id="openOnly" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="genre-row" id="genreRow"></div>
  </div>

  <div id="map"></div>

  <div class="list-head">
    <h2>店舗一覧</h2>
    <span class="n" id="listCount"></span>
  </div>
  <ul class="shop-list" id="shopList"><li class="loading">お店を探しています…</li></ul>

  <footer>
    地図データ &copy; OpenStreetMap contributors<br>
    <a href="https://webservice.recruit.co.jp/" target="_blank" rel="noopener">Powered by ホットペッパー グルメ Webサービス</a>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ===== 設定 =====
const PROXY_BASE = "https://ima-meshi-proxy.emsc3f-g-vo.workers.dev";
const CENTER = { lat: 35.1685, lng: 136.9040 }; // 栄・伏見中間あたり
const SEARCH_RANGE = 3;  // 1=300m 2=500m 3=1000m 4=2000m 5=3000m
const SEARCH_COUNT = 30;

// ジャンル名 → 表示アイコン（大まかなキーワード一致。未一致は🍴）
const ICON_RULES = [
  [/焼肉|ホルモン/, "🥩"], [/ラーメン/, "🍜"], [/寿司|鮨/, "🍣"],
  [/カフェ|喫茶/, "☕"], [/イタリアン|フレンチ|洋食/, "🍝"],
  [/中華/, "🥟"], [/居酒屋|バー|ダイニング/, "🍶"], [/カレー/, "🍛"],
  [/焼き鳥|串/, "🍢"], [/お好み焼き|もんじゃ/, "🥞"],
];
const COLOR_PALETTE = ["#8C3A2B","#B0432B","#C97A2B","#8A6A3F","#3F6B8A","#5C7A4B","#A6402F","#6E5327","#7A4A6E","#3F6B58"];

function iconFor(genre){
  for(const [re, icon] of ICON_RULES){ if(re.test(genre)) return icon; }
  return "🍴";
}
function colorFor(genre){
  let sum = 0;
  for(let i=0;i<genre.length;i++) sum += genre.charCodeAt(i);
  return COLOR_PALETTE[sum % COLOR_PALETTE.length];
}

// ===== 営業時間テキストのベストエフォート解析 =====
function parseOpenRanges(text){
  if(!text) return [];
  const re = /(\d{1,2}:\d{2})\s*[~〜\-ー]\s*(\d{1,2}:\d{2})/g;
  const ranges = [];
  let m;
  while((m = re.exec(text)) !== null){
    ranges.push([m[1], m[2]]);
  }
  return ranges;
}
function toMinutes(hhmm){
  const [h,m] = hhmm.split(":").map(Number);
  return h*60+m;
}
function isOpenNow(ranges, now){
  if(ranges.length === 0) return null;
  const nowMin = now.getHours()*60 + now.getMinutes();
  for(const [o,c] of ranges){
    let oM = toMinutes(o), cM = toMinutes(c);
    if(cM <= oM) cM += 24*60;
    let n = nowMin;
    if(n >= oM && n < cM) return true;
    if(cM > 24*60 && (nowMin + 24*60) >= oM && (nowMin + 24*60) < cM) return true;
  }
  return false;
}

let activeGenre = "すべて";
let openOnly = true;
let allShops = [];
let usingSampleData = false;

const map = L.map('map', {zoomControl:false, attributionControl:false}).setView([CENTER.lat, CENTER.lng], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
L.control.zoom({position:'bottomright'}).addTo(map);
let markers = [];

function makeIcon(shop){
  const bg = shop.open_now === true ? '#4B7A5B' : (shop.open_now === false ? '#A79E90' : '#B99B6B');
  const html = `<div class="pin-badge" style="background:${bg}"><span>${iconFor(shop.genre)}</span></div>`;
  return L.divIcon({html, className:'', iconSize:[30,30], iconAnchor:[15,30], popupAnchor:[0,-28]});
}

function statusLabel(open_now){
  if(open_now === true) return {cls:'status-open', text:'営業中'};
  if(open_now === false) return {cls:'status-closed', text:'営業時間外'};
  return {cls:'status-unknown', text:'営業時間不明'};
}

function render(){
  const now = new Date();
  document.getElementById('clock').textContent =
    String(now.getHours()).padStart(2,'0')+":"+String(now.getMinutes()).padStart(2,'0');

  const withStatus = allShops.map(s => ({...s, open_now: isOpenNow(s.ranges, now)}));
  const openCount = withStatus.filter(s=>s.open_now === true).length;
  document.getElementById('openCount').textContent = `${openCount}/${allShops.length}件が営業中`;

  let filtered = withStatus.filter(s => activeGenre === "すべて" || s.genre === activeGenre);
  if(openOnly) filtered = filtered.filter(s => s.open_now === true);

  markers.forEach(m => map.removeLayer(m));
  markers = [];
  filtered.forEach(s => {
    const marker = L.marker([s.lat, s.lng], {icon: makeIcon(s)}).addTo(map);
    marker.bindPopup(`<strong>${s.name}</strong><br>${s.genre}${s.budget ? '・'+s.budget : ''}<br>${s.openText || '営業時間情報なし'}`);
    markers.push(marker);
  });

  const list = document.getElementById('shopList');
  list.innerHTML = '';
  document.getElementById('listCount').textContent = `${filtered.length}件`;

  if(filtered.length === 0){
    list.innerHTML = `<li class="loading">条件に合うお店が見つかりませんでした</li>`;
    return;
  }

  filtered
    .sort((a,b) => (b.open_now === true) - (a.open_now === true))
    .forEach(s => {
      const li = document.createElement('li');
      li.className = 'shop-card';
      const st = statusLabel(s.open_now);
      const thumbStyle = s.photo
        ? `background-image:url('${s.photo}')`
        : `background:${colorFor(s.genre)}`;
      li.innerHTML = `
        <div class="thumb" style="${thumbStyle}">${s.photo ? '' : iconFor(s.genre)}</div>
        <div class="shop-main">
          <div class="shop-top">
            <p class="shop-name">${s.name}</p>
            <span class="status-pill ${st.cls}">${st.text}</span>
          </div>
          <div class="shop-meta">
            <span>${s.genre}</span>
            ${s.area ? `<span class="dot">${s.area}</span>` : ''}
            ${s.budget ? `<span class="dot">${s.budget}</span>` : ''}
          </div>
          ${s.url ? `<a class="shop-link" href="${s.url}" target="_blank" rel="noopener">詳細を見る（ホットペッパー）→</a>` : ''}
        </div>
      `;
      li.addEventListener('click', (e) => {
        if(e.target.tagName === 'A') return;
        map.setView([s.lat, s.lng], 17, {animate:true});
      });
      list.appendChild(li);
    });
}

function buildGenreChips(){
  const genres = ["すべて", ...new Set(allShops.map(s => s.genre))];
  const genreRow = document.getElementById('genreRow');
  genreRow.innerHTML = '';
  genres.forEach(g => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (g === activeGenre ? ' active' : '');
    chip.textContent = g;
    chip.addEventListener('click', () => {
      activeGenre = g;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      render();
    });
    genreRow.appendChild(chip);
  });
}

function showBanner(message, isError){
  const el = document.getElementById('statusBanner');
  el.innerHTML = `<div class="banner${isError ? ' error' : ''}">${message}</div>`;
}

const SAMPLE_SHOPS = [
  {name:"炭火焼鳥 伏見横丁", genre:"居酒屋", area:"伏見", budget:"¥3,000〜¥4,000", openText:"17:00~24:00", lat:35.1660, lng:136.8990},
  {name:"栄 ホルモン本舗", genre:"焼肉", area:"栄", budget:"¥4,000〜¥5,000", openText:"17:30~26:00", lat:35.1705, lng:136.9085},
  {name:"らーめん 一心", genre:"ラーメン", area:"栄", budget:"¥900〜¥1,300", openText:"11:00~22:00", lat:35.1692, lng:136.9065},
  {name:"喫茶 モーニング堂", genre:"カフェ", area:"伏見", budget:"¥600〜¥1,000", openText:"07:00~18:00", lat:35.1648, lng:136.8975},
  {name:"名駅寿司 伏見店", genre:"寿司", area:"伏見", budget:"¥5,000〜¥8,000", openText:"17:00~23:00", lat:35.1672, lng:136.8998},
].map(s => ({...s, ranges: parseOpenRanges(s.openText), url:null, photo:null}));

async function loadFromApi(){
  const url = `${PROXY_BASE}/?lat=${CENTER.lat}&lng=${CENTER.lng}&range=${SEARCH_RANGE}&order=4&count=${SEARCH_COUNT}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  const shops = (data.results && data.results.shop) || [];
  if(shops.length === 0) throw new Error("0 results");

  return shops.map(shop => ({
    name: shop.name,
    genre: (shop.genre && shop.genre.name) || "その他",
    area: (shop.small_area && shop.small_area.name) || (shop.middle_area && shop.middle_area.name) || "",
    budget: (shop.budget && shop.budget.name) || "",
    lat: parseFloat(shop.lat),
    lng: parseFloat(shop.lng),
    openText: shop.open || "",
    ranges: parseOpenRanges(shop.open || ""),
    url: (shop.urls && shop.urls.pc) || null,
    photo: (shop.photo && shop.photo.pc && shop.photo.pc.l) || null,
  }));
}

async function init(){
  try{
    allShops = await loadFromApi();
    usingSampleData = false;
  }catch(err){
    console.error("API取得失敗、サンプルデータにフォールバック:", err);
    allShops = SAMPLE_SHOPS;
    usingSampleData = true;
    showBanner("実データの取得に失敗したため、サンプルデータを表示しています（Workerの設定またはCORSをご確認ください）", true);
  }
  buildGenreChips();
  document.getElementById('openOnly').addEventListener('change', (e) => {
    openOnly = e.target.checked;
    render();
  });
  render();
  setInterval(render, 30000);
}

init();
</script>
</body>
</html>
