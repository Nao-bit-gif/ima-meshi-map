
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>今メシ｜栄・伏見の営業中グルメマップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root{
    --paper:#FAF5EC; --ink:#2B2118; --miso:#8C3A2B; --miso-deep:#6E2C20;
    --dashi:#D8A24A; --open:#4B7A5B; --closed:#A79E90; --unknown:#B99B6B;
    --line:#E4D9C6; --card:#FFFFFF; --heart:#C0392B; --line-brand:#06C755; --x-brand:#111111;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Noto Sans JP', sans-serif; -webkit-font-smoothing:antialiased; }
  .app{ max-width:480px; margin:0 auto; min-height:100vh; background:var(--paper); display:flex; flex-direction:column; }

  header{ padding:22px 20px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--paper); z-index:500; }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand h1{ font-family:'Shippori Mincho B1', serif; font-weight:700; font-size:28px; margin:0; color:var(--miso-deep); letter-spacing:0.02em; }
  .brand span{ font-size:12px; color:var(--ink); opacity:0.55; }
  .subline{ margin:4px 0 0; font-size:13px; color:var(--ink); opacity:0.6; }
  .clock{ font-variant-numeric:tabular-nums; font-weight:500; }

  .controls{ padding:14px 20px 4px; display:flex; flex-direction:column; gap:10px; }

  .search-box{ position:relative; }
  .search-box input{
    width:100%; padding:11px 14px 11px 38px; border-radius:10px; border:1px solid var(--line);
    background:var(--card); font-size:14px; font-family:inherit; color:var(--ink);
  }
  .search-box input:focus{ outline:none; border-color:var(--dashi); }
  .search-box .icon{ position:absolute; left:13px; top:50%; transform:translateY(-50%); opacity:0.4; font-size:14px; }
  .search-box .clear{ position:absolute; right:10px; top:50%; transform:translateY(-50%); opacity:0.4; cursor:pointer; font-size:13px; display:none; background:none; border:none; }

  .toggle-row{ display:flex; gap:8px; }
  .open-toggle{ flex:1; display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:11px 14px; }
  .open-toggle .label{ font-size:13px; font-weight:500; }
  .open-toggle .count{ font-size:11px; color:var(--ink); opacity:0.5; margin-left:4px; display:block; }
  .switch{ position:relative; width:40px; height:24px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{ position:absolute; inset:0; background:#D8CFBE; border-radius:999px; cursor:pointer; transition:background .18s ease; }
  .slider::before{ content:""; position:absolute; height:18px; width:18px; left:3px; top:3px; background:white; border-radius:50%; transition:transform .18s ease; box-shadow:0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked + .slider{ background:var(--open); }
  .switch input:checked + .slider::before{ transform:translateX(16px); }
  .fav-toggle input:checked + .slider{ background:var(--heart); }

  .genre-scroll{ position:relative; }
  .genre-row{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none;
    -webkit-overflow-scrolling:touch; scroll-snap-type:x proximity; touch-action:pan-x;
  }
  .genre-row::-webkit-scrollbar{ display:none; }
  .genre-scroll::after{
    content:""; position:absolute; top:0; right:0; bottom:4px; width:28px; pointer-events:none;
    background:linear-gradient(to right, transparent, var(--paper));
  }
  .chip{
    flex:0 0 auto; padding:7px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); font-size:13px; cursor:pointer; white-space:nowrap; scroll-snap-align:start;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .chip.active{ background:var(--miso); border-color:var(--miso); color:white; }

  #mapWrap{ position:relative; }
  #map{ height:280px; width:100%; margin-top:12px; filter:saturate(0.9); }
  .leaflet-popup-content-wrapper{ border-radius:10px; font-family:'Noto Sans JP', sans-serif; }
  .pin-badge{
    display:flex; align-items:center; justify-content:center; width:30px; height:30px;
    border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    box-shadow:0 2px 4px rgba(0,0,0,.25); border:2px solid white;
  }
  .pin-badge.fav{ border-color:var(--heart); border-width:3px; }
  .pin-badge span{ transform:rotate(45deg); font-size:14px; }
  .user-dot{ width:16px; height:16px; border-radius:50%; background:#3B82F6; border:3px solid white; box-shadow:0 0 0 4px rgba(59,130,246,0.35); }
  .locate-btn{
    position:absolute; right:10px; bottom:22px; z-index:600; background:var(--card); border:1px solid var(--line);
    border-radius:8px; width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    font-size:16px; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.15);
  }

  .list-head{ padding:18px 20px 8px; display:flex; align-items:baseline; justify-content:space-between; }
  .list-head h2{ font-family:'Shippori Mincho B1', serif; font-size:16px; margin:0; font-weight:700; }
  .list-head .n{ font-size:12px; opacity:0.5; }
  ul.shop-list{ list-style:none; margin:0; padding:0 20px 28px; display:flex; flex-direction:column; gap:10px; }
  .shop-card{
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px;
    display:flex; gap:12px; align-items:flex-start; cursor:pointer; transition:border-color .15s ease;
    position:relative;
  }
  .shop-card:hover{ border-color:var(--dashi); }
  .thumb{
    width:46px; height:46px; border-radius:10px; flex-shrink:0; display:flex;
    align-items:center; justify-content:center; font-size:20px; color:white; overflow:hidden;
    background-size:cover; background-position:center;
  }
  .shop-main{ flex:1; min-width:0; }
  .shop-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .shop-name{ font-weight:700; font-size:14.5px; margin:0; line-height:1.4; padding-right:22px; }
  .status-pill{ flex-shrink:0; font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; white-space:nowrap; }
  .status-open{ background:#E7F1E9; color:var(--open); }
  .status-closed{ background:#EFECE5; color:var(--closed); }
  .status-unknown{ background:#F5EDDD; color:var(--unknown); }
  .shop-meta{ margin:5px 0 0; font-size:12.5px; opacity:0.65; display:flex; gap:8px; flex-wrap:wrap; }
  .shop-meta .dot::before{ content:"・"; opacity:0.6; }
  .shop-actions{ display:flex; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap; }
  .shop-link{ font-size:12px; color:var(--miso); text-decoration:none; }
  .share-btn{ font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; text-decoration:none; color:white; }
  .share-line{ background:var(--line-brand); }
  .share-x{ background:var(--x-brand); }
  .fav-btn{ position:absolute; top:14px; right:14px; background:none; border:none; font-size:18px; cursor:pointer; line-height:1; opacity:0.35; padding:2px; }
  .fav-btn.active{ opacity:1; }

  footer{ padding:16px 20px 28px; font-size:11px; text-align:center; color:var(--ink); opacity:0.6; border-top:1px solid var(--line); line-height:1.7; }
  footer a{ color:inherit; }

  .banner{ margin:14px 20px 0; padding:11px 13px; background:#FFF6E9; border:1px solid #EFDBAE; border-radius:10px; font-size:12px; line-height:1.6; color:#6E5327; }
  .banner.error{ background:#FBECEA; border-color:#E9C3BC; color:#7A3226; }
  .banner.info{ background:#EAF1FB; border-color:#C6D9F0; color:#2C4A73; }
  .loading{ text-align:center; padding:24px 0; opacity:0.5; font-size:13px; }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <h1>今メシ</h1>
      <span>栄・伏見 営業中グルメマップ</span>
    </div>
    <p class="subline" id="subline">現在時刻 <span class="clock" id="clock">--:--</span> 時点で営業中のお店を表示</p>
  </header>

  <div id="statusBanner"></div>

  <div class="controls">
    <div class="search-box">
      <span class="icon">🔎</span>
      <input type="text" id="searchInput" placeholder="店名・エリアで検索">
      <button class="clear" id="clearSearch">✕</button>
    </div>

    <div class="toggle-row">
      <div class="open-toggle">
        <div><span class="label">営業中のみ</span><span class="count" id="openCount"></span></div>
        <label class="switch"><input type="checkbox" id="openOnly" checked><span class="slider"></span></label>
      </div>
      <div class="open-toggle">
        <div><span class="label">お気に入りのみ</span><span class="count" id="favCount"></span></div>
        <label class="switch fav-toggle"><input type="checkbox" id="favOnly"><span class="slider"></span></label>
      </div>
    </div>

    <div class="genre-scroll">
      <div class="genre-row" id="genreRow"></div>
    </div>
  </div>

  <div id="mapWrap">
    <div id="map"></div>
    <button class="locate-btn" id="locateBtn" title="現在地に移動">📍</button>
  </div>

  <div class="list-head">
    <h2>店舗一覧</h2>
    <span class="n" id="listCount"></span>
  </div>
  <ul class="shop-list" id="shopList"><li class="loading">お店を探しています…</li></ul>

  <footer>
    地図データ &copy; OpenStreetMap contributors<br>
    <a href="https://webservice.recruit.co.jp/" target="_blank" rel="noopener">Powered by ホットペッパー グルメ Webサービス</a>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ===== 設定 =====
const PROXY_BASE = "https://ima-meshi-proxy.emsc3f-g-vo.workers.dev";
const CENTER = { lat: 35.1685, lng: 136.9040 };
const SEARCH_RANGE = 4;
const SEARCH_COUNT = 30;
const FAV_STORAGE_KEY = "imameshi_favorites";
const GENRE_CACHE_KEY = "imameshi_genre_cache_v1";
const APP_URL = "https://nao-bit-gif.github.io/ima-meshi-map/";

// ジャンルチップ定義：genreは公式ジャンルコード、keywordはフリーワード検索
const GENRE_CHIPS = [
  { key:"ALL",      label:"すべて",            params:{} },
  { key:"IZAKAYA",  label:"居酒屋",            params:{genre:"G001"} },
  { key:"YAKINIKU", label:"焼肉・ホルモン",     params:{genre:"G008"} },
  { key:"RAMEN",    label:"ラーメン",          params:{genre:"G013"} },
  { key:"CHINESE",  label:"中華",              params:{genre:"G007"} },
  { key:"ITALIAN",  label:"イタリアン・フレンチ", params:{genre:"G006"} },
  { key:"WASHOKU",  label:"和食",              params:{genre:"G004"} },
  { key:"CAFE",     label:"カフェ・スイーツ",   params:{genre:"G015"} },
  { key:"OKONOMI",  label:"お好み焼き・もんじゃ", params:{genre:"G014"} },
  { key:"BAR",      label:"バー・カクテル",     params:{genre:"G012"} },
  { key:"ASIAN",    label:"アジア・エスニック料理", params:{genre:"G009"} },
  { key:"SUSHI",    label:"寿司",              params:{keyword:"寿司"} },
  { key:"YAKITORI", label:"焼き鳥・串",         params:{keyword:"焼き鳥"} },
  { key:"KISSA",    label:"喫茶店",            params:{keyword:"喫茶"} },
  { key:"UDON",     label:"うどん",            params:{keyword:"うどん"} },
  { key:"OMURICE",  label:"オムライス",         params:{keyword:"オムライス"} },
  { key:"CURRY",    label:"カレー",            params:{keyword:"カレー"} },
];

const ICON_RULES = [
  [/焼肉|ホルモン/, "🥩"], [/ラーメン/, "🍜"], [/寿司|鮨/, "🍣"],
  [/カフェ|喫茶/, "☕"], [/イタリアン|フレンチ|洋食/, "🍝"],
  [/中華/, "🥟"], [/居酒屋|バー|ダイニング/, "🍶"], [/カレー/, "🍛"],
  [/焼き鳥|串/, "🍢"], [/お好み焼き|もんじゃ/, "🥞"], [/うどん/, "🍥"],
];
const COLOR_PALETTE = ["#8C3A2B","#B0432B","#C97A2B","#8A6A3F","#3F6B8A","#5C7A4B","#A6402F","#6E5327","#7A4A6E","#3F6B58"];

function iconFor(genre){ for(const [re, icon] of ICON_RULES){ if(re.test(genre)) return icon; } return "🍴"; }
function colorFor(genre){ let sum=0; for(let i=0;i<genre.length;i++) sum+=genre.charCodeAt(i); return COLOR_PALETTE[sum % COLOR_PALETTE.length]; }

function parseOpenRanges(text){
  if(!text) return [];
  const re = /(\d{1,2}:\d{2})\s*[~〜\-ー]\s*(\d{1,2}:\d{2})/g;
  const ranges = []; let m;
  while((m = re.exec(text)) !== null){ ranges.push([m[1], m[2]]); }
  return ranges;
}
function toMinutes(hhmm){ const [h,m]=hhmm.split(":").map(Number); return h*60+m; }
function isOpenNow(ranges, now){
  if(ranges.length === 0) return null;
  const nowMin = now.getHours()*60 + now.getMinutes();
  for(const [o,c] of ranges){
    let oM=toMinutes(o), cM=toMinutes(c);
    if(cM <= oM) cM += 24*60;
    if(nowMin >= oM && nowMin < cM) return true;
    if(cM > 24*60 && (nowMin+24*60) >= oM && (nowMin+24*60) < cM) return true;
  }
  return false;
}

function haversine(lat1,lng1,lat2,lng2){
  const R=6371000, toRad = x => x*Math.PI/180;
  const dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function formatDistance(m){ return m < 1000 ? `${Math.round(m)}m` : `${(m/1000).toFixed(1)}km`; }

function loadFavorites(){
  try{ const raw = localStorage.getItem(FAV_STORAGE_KEY); return new Set(raw ? JSON.parse(raw) : []); }
  catch(e){ return new Set(); }
}
function saveFavorites(set){ try{ localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify([...set])); }catch(e){} }
let favorites = loadFavorites();

// ===== ジャンル別キャッシュ（月初・月半ばで自動更新） =====
function loadGenreCache(){
  try{ return JSON.parse(localStorage.getItem(GENRE_CACHE_KEY) || "{}"); }catch(e){ return {}; }
}
function saveGenreCache(cache){ try{ localStorage.setItem(GENRE_CACHE_KEY, JSON.stringify(cache)); }catch(e){} }
let genreCache = loadGenreCache();
function currentPeriodKey(now = new Date()){
  const y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,'0');
  const half = now.getDate() <= 14 ? 'A' : 'B'; // 1〜14日=A、15日〜月末=B（1日と15日に切り替わる）
  return `${y}-${m}-${half}`;
}

function addBanner(message, type){
  const el = document.getElementById('statusBanner');
  const div = document.createElement('div');
  div.className = `banner${type ? ' '+type : ''}`;
  div.textContent = message;
  el.appendChild(div);
}

let activeChipKey = "ALL";
let openOnly = true;
let favOnly = false;
let searchQuery = "";
let currentShops = [];
let userLoc = null;
let userMarker = null;

const map = L.map('map', {zoomControl:false, attributionControl:false}).setView([CENTER.lat, CENTER.lng], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
L.control.zoom({position:'bottomright'}).addTo(map);
let markers = [];

function makeIcon(shop){
  const bg = shop.open_now === true ? '#4B7A5B' : (shop.open_now === false ? '#A79E90' : '#B99B6B');
  const favClass = favorites.has(shop.id) ? ' fav' : '';
  const html = `<div class="pin-badge${favClass}" style="background:${bg}"><span>${iconFor(shop.genre)}</span></div>`;
  return L.divIcon({html, className:'', iconSize:[30,30], iconAnchor:[15,30], popupAnchor:[0,-28]});
}
function statusLabel(open_now){
  if(open_now === true) return {cls:'status-open', text:'営業中'};
  if(open_now === false) return {cls:'status-closed', text:'営業時間外'};
  return {cls:'status-unknown', text:'営業時間不明'};
}
function matchesSearch(s, q){
  if(!q) return true;
  return (s.name+" "+s.genre+" "+s.area).toLowerCase().includes(q.toLowerCase());
}
function shareLinks(s){
  const text = encodeURIComponent(`${s.name}（${s.genre}）を見つけた！ #今メシ`);
  const url = encodeURIComponent(s.url || APP_URL);
  return {
    line: `https://line.me/R/msg/text/?${text}%20${url}`,
    x: `https://twitter.com/intent/tweet?text=${text}&url=${url}`,
  };
}

function render(){
  const now = new Date();
  document.getElementById('clock').textContent =
    String(now.getHours()).padStart(2,'0')+":"+String(now.getMinutes()).padStart(2,'0');

  const withStatus = currentShops.map(s => ({
    ...s,
    open_now: isOpenNow(s.ranges, now),
    distance: userLoc ? haversine(userLoc.lat, userLoc.lng, s.lat, s.lng) : null,
  }));
  const openCount = withStatus.filter(s=>s.open_now === true).length;
  document.getElementById('openCount').textContent = `${openCount}/${currentShops.length}件`;
  document.getElementById('favCount').textContent = `${favorites.size}件`;

  let filtered = withStatus;
  if(openOnly) filtered = filtered.filter(s => s.open_now === true);
  if(favOnly) filtered = filtered.filter(s => favorites.has(s.id));
  if(searchQuery) filtered = filtered.filter(s => matchesSearch(s, searchQuery));

  markers.forEach(m => map.removeLayer(m));
  markers = [];
  filtered.forEach(s => {
    const marker = L.marker([s.lat, s.lng], {icon: makeIcon(s)}).addTo(map);
    marker.bindPopup(`<strong>${s.name}</strong><br>${s.genre}${s.budget ? '・'+s.budget : ''}<br>${s.openText || '営業時間情報なし'}`);
    markers.push(marker);
  });

  const list = document.getElementById('shopList');
  list.innerHTML = '';
  document.getElementById('listCount').textContent = `${filtered.length}件`;

  if(filtered.length === 0){
    list.innerHTML = `<li class="loading">条件に合うお店が見つかりませんでした</li>`;
    return;
  }

  filtered
    .sort((a,b) => {
      const ao = a.open_now === true ? 0 : 1, bo = b.open_now === true ? 0 : 1;
      if(ao !== bo) return ao - bo;
      if(userLoc) return (a.distance ?? Infinity) - (b.distance ?? Infinity);
      return 0;
    })
    .forEach(s => {
      const li = document.createElement('li');
      li.className = 'shop-card';
      const st = statusLabel(s.open_now);
      const isFav = favorites.has(s.id);
      const links = shareLinks(s);
      const thumbInner = s.photo
        ? `<img src="${s.photo}" loading="lazy" decoding="async" alt="" style="width:100%;height:100%;object-fit:cover;">`
        : iconFor(s.genre);
      const thumbStyle = s.photo ? '' : `background:${colorFor(s.genre)}`;
      li.innerHTML = `
        <button class="fav-btn${isFav ? ' active' : ''}" data-id="${s.id}" aria-label="お気に入り">${isFav ? '❤️' : '🤍'}</button>
        <div class="thumb" style="${thumbStyle}">${thumbInner}</div>
        <div class="shop-main">
          <div class="shop-top">
            <p class="shop-name">${s.name}</p>
            <span class="status-pill ${st.cls}">${st.text}</span>
          </div>
          <div class="shop-meta">
            <span>${s.genre}</span>
            ${s.area ? `<span class="dot">${s.area}</span>` : ''}
            ${s.budget ? `<span class="dot">${s.budget}</span>` : ''}
            ${s.distance != null ? `<span class="dot">${formatDistance(s.distance)}</span>` : ''}
          </div>
          <div class="shop-actions">
            ${s.url ? `<a class="shop-link" href="${s.url}" target="_blank" rel="noopener">詳細を見る→</a>` : ''}
            <a class="share-btn share-line" href="${links.line}" target="_blank" rel="noopener">LINE</a>
            <a class="share-btn share-x" href="${links.x}" target="_blank" rel="noopener">X</a>
          </div>
        </div>
      `;
      li.querySelector('.fav-btn').addEventListener('click', (e) => { e.stopPropagation(); toggleFavorite(s.id); });
      li.addEventListener('click', (e) => {
        if(e.target.tagName === 'A' || e.target.classList.contains('fav-btn')) return;
        map.setView([s.lat, s.lng], 17, {animate:true});
      });
      list.appendChild(li);
    });
}

function toggleFavorite(id){
  if(favorites.has(id)) favorites.delete(id); else favorites.add(id);
  saveFavorites(favorites);
  render();
}

function buildGenreChips(){
  const genreRow = document.getElementById('genreRow');
  genreRow.innerHTML = '';
  GENRE_CHIPS.forEach(chip => {
    const el = document.createElement('div');
    el.className = 'chip' + (chip.key === activeChipKey ? ' active' : '');
    el.textContent = chip.label;
    el.dataset.key = chip.key;
    el.addEventListener('click', () => selectChip(chip));
    genreRow.appendChild(el);
  });
}
function updateChipUI(){
  document.querySelectorAll('.chip').forEach(el => {
    el.classList.toggle('active', el.dataset.key === activeChipKey);
  });
}

async function fetchShops(extraParams){
  const params = new URLSearchParams({
    lat: CENTER.lat, lng: CENTER.lng, range: SEARCH_RANGE, order: 4, count: SEARCH_COUNT, ...extraParams,
  });
  const res = await fetch(`${PROXY_BASE}/?${params.toString()}`);
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  const shops = (data.results && data.results.shop) || [];
  return shops.map(shop => ({
    id: shop.id,
    name: shop.name,
    genre: (shop.genre && shop.genre.name) || "その他",
    area: (shop.small_area && shop.small_area.name) || (shop.middle_area && shop.middle_area.name) || "",
    budget: (shop.budget && shop.budget.name) || "",
    lat: parseFloat(shop.lat),
    lng: parseFloat(shop.lng),
    openText: shop.open || "",
    ranges: parseOpenRanges(shop.open || ""),
    url: (shop.urls && shop.urls.pc) || null,
    photo: (shop.photo && shop.photo.pc && (shop.photo.pc.s || shop.photo.pc.m || shop.photo.pc.l)) || null,
  }));
}

async function getShopsForChip(chip){
  const period = currentPeriodKey();
  const cached = genreCache[chip.key];
  if(cached && cached.periodKey === period){
    return cached.shops;
  }
  const shops = await fetchShops(chip.params);
  genreCache[chip.key] = { periodKey: period, shops };
  saveGenreCache(genreCache);
  return shops;
}

async function selectChip(chip){
  activeChipKey = chip.key;
  updateChipUI();

  const period = currentPeriodKey();
  const cached = genreCache[chip.key];

  if(cached && cached.shops && cached.shops.length){
    // キャッシュがあれば期間が古くても即表示（体感速度優先）
    currentShops = cached.shops;
    render();
  }else{
    document.getElementById('shopList').innerHTML = `<li class="loading">読み込み中…</li>`;
  }

  const needsRefresh = !cached || cached.periodKey !== period;
  if(!needsRefresh) return;

  try{
    const shops = await fetchShops(chip.params);
    if(shops.length === 0) throw new Error("0 results");
    genreCache[chip.key] = { periodKey: period, shops };
    saveGenreCache(genreCache);
    if(activeChipKey === chip.key){
      currentShops = shops;
      render();
    }
  }catch(err){
    console.error("取得失敗:", err);
    if(!cached){
      if(chip.key === "ALL"){
        currentShops = SAMPLE_SHOPS;
        addBanner("実データの取得に失敗したため、サンプルデータを表示しています（Workerの設定またはCORSをご確認ください）", "error");
      }else{
        addBanner(`「${chip.label}」のお店が見つかりませんでした`, "info");
        currentShops = [];
      }
      render();
    }
    // キャッシュ済みデータがある場合は、更新に失敗しても表示中のデータをそのまま維持
  }
}

function placeUserMarker(){
  if(!userLoc) return;
  if(userMarker) map.removeLayer(userMarker);
  const icon = L.divIcon({ html:'<div class="user-dot"></div>', className:'', iconSize:[16,16], iconAnchor:[8,8] });
  userMarker = L.marker([userLoc.lat, userLoc.lng], {icon, zIndexOffset:1000}).addTo(map);
}
function requestLocation(){
  if(!navigator.geolocation){
    addBanner("お使いのブラウザは現在地取得に対応していません", "info");
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      placeUserMarker();
      document.getElementById('subline').textContent = "現在地から近い順・営業中のお店を表示";
      render();
    },
    (err) => {
      console.warn("Geolocation error:", err);
      addBanner("現在地が取得できなかったため、近い順表示は使えません（位置情報の許可設定をご確認ください）", "info");
    },
    { enableHighAccuracy:true, timeout:8000 }
  );
}
document.getElementById('locateBtn').addEventListener('click', () => {
  if(userLoc){ map.setView([userLoc.lat, userLoc.lng], 16, {animate:true}); }
  else { requestLocation(); }
});

async function init(){
  buildGenreChips();

  document.getElementById('openOnly').addEventListener('change', (e) => { openOnly = e.target.checked; render(); });
  document.getElementById('favOnly').addEventListener('change', (e) => { favOnly = e.target.checked; render(); });

  const searchInput = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearSearch');
  searchInput.addEventListener('input', (e) => {
    searchQuery = e.target.value.trim();
    clearBtn.style.display = searchQuery ? 'block' : 'none';
    render();
  });
  clearBtn.addEventListener('click', () => {
    searchInput.value = ''; searchQuery = ''; clearBtn.style.display = 'none'; render();
  });

  requestLocation();
  selectChip(GENRE_CHIPS[0]); // 初期表示は「すべて」（awaitしないことで体感速度を優先）
  setInterval(render, 30000);
}

init();
</script>
